# WirePlumber ALSA headroom configuration for GPD Win5
# Prevents audio clipping by reserving headroom

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_64_00.6.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom = 4096
      }
    }
  }
]

